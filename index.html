<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Botiquín Claro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout: a phone-sized prototype centered beside a demo script panel; the phone fills the width on small screens. */
:root{
  --bg:#EEF5F8; --surface:#FFFFFF; --surface2:#F5FAFB; --ink:#12303D; --muted:#546F7D; --line:#D5E3E9;
  --blue:#1F6E9F; --on-blue:#FFFFFF; --blue-soft:#E0EFF7;
  --green:#2F8A62; --on-green:#FFFFFF; --green-soft:#E1F3EA;
  --amber:#8F5A10; --amber-soft:#FBEFD6; --red:#AE3B33; --red-soft:#FBE4E1;
  --frame:#C9DAE2; --shadow:0 18px 50px rgba(18,48,61,.14); --scrim:rgba(10,30,40,.5);
  --alert-bg:#B4361E; --alert-fg:#FFFFFF;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1B22; --surface:#15262F; --surface2:#1A2F3A; --ink:#E4F0F4; --muted:#9DB6C2; --line:#2A4350;
    --blue:#7CC0EA; --on-blue:#0B2230; --blue-soft:#1A3B4D;
    --green:#73CFA2; --on-green:#0B2A1D; --green-soft:#173A2C;
    --amber:#E7B764; --amber-soft:#3A2E15; --red:#F29A92; --red-soft:#402220;
    --frame:#2A4350; --shadow:0 18px 50px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
    --alert-bg:#F29A92; --alert-fg:#3A0F0B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1B22; --surface:#15262F; --surface2:#1A2F3A; --ink:#E4F0F4; --muted:#9DB6C2; --line:#2A4350;
  --blue:#7CC0EA; --on-blue:#0B2230; --blue-soft:#1A3B4D;
  --green:#73CFA2; --on-green:#0B2A1D; --green-soft:#173A2C;
  --amber:#E7B764; --amber-soft:#3A2E15; --red:#F29A92; --red-soft:#402220;
  --frame:#2A4350; --shadow:0 18px 50px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
  --alert-bg:#F29A92; --alert-fg:#3A0F0B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);padding-inline:16px;padding-block:20px;line-height:1.4}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ic{flex:none;display:block}

/* Barra superior de la presentación */
.top{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:44px;height:44px;border-radius:14px;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;flex:none}
.brand h1{font:600 1.3rem var(--font-head);margin:0}
.brand p{margin:0;color:var(--muted);font-size:.9rem}
.top-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;min-height:44px;padding:0 16px;border-radius:10px;font-weight:700;font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.seg button.ph[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.reset{min-height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;padding:0 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--muted)}

.stage{max-width:1080px;margin:22px auto 0;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:32px;justify-content:center;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}

/* Teléfono */
.phone{position:relative;width:100%;max-width:400px;margin-inline:auto;height:min(790px,calc(100dvh - 40px));min-height:640px;background:var(--bg);border:8px solid var(--frame);border-radius:40px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;font-size:17px}
.phone.big{font-size:20px}
.ph-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;min-height:64px}
.ph-head h2{font:600 1.2em var(--font-head);margin:0;flex:1;min-width:0}
.phone.pharm .ph-head{background:var(--green-soft)}
.icon-btn{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.ph-main{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 24px;display:flex;flex-direction:column;gap:14px}
.ph-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;border-top:1px solid var(--line);background:var(--surface);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.ph-nav button{border:0;background:transparent;min-height:60px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.7em;font-weight:700;color:var(--muted);cursor:pointer;padding:0 1px;min-width:0}
.ph-nav button[aria-current="page"]{color:var(--blue);background:var(--blue-soft)}
.ph-foot{padding:10px 16px;font-size:.78em;color:var(--muted);border-top:1px solid var(--line);background:var(--surface);text-align:center}

/* Componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3,.h3{font:600 1.02em var(--font-head);margin:0}
.muted{color:var(--muted)}
.small{font-size:.82em}
.hello{font:600 1.5em var(--font-head);margin:0}
.btn{min-height:56px;border-radius:16px;border:2px solid transparent;font:700 1em var(--font-body);padding:8px 18px;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-align:center;width:100%}
.btn.primary{background:var(--blue);color:var(--on-blue)}
.btn.secondary{background:var(--blue-soft);color:var(--blue)}
.btn.green{background:var(--green);color:var(--on-green)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
a.btn{text-decoration:none}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-row.one{grid-template-columns:1fr}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:.78em;font-weight:700;white-space:nowrap}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.red{background:var(--red-soft);color:var(--red)}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:8px;background:var(--blue)}
.bar.g>i{background:var(--green)}
.bar.a>i{background:var(--amber)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-height:92px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.tile .n{font:600 2em var(--font-head);line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:.82em;color:var(--muted);font-weight:700}
.tile .ic{margin-bottom:2px}
.t-blue .ic{color:var(--blue)}.t-amber .ic{color:var(--amber)}.t-green .ic{color:var(--green)}
.med-row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;min-height:72px}
.med-row .ico{width:44px;height:44px;border-radius:14px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.med-row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.med-row b{font-size:1em}
.med-row span{font-size:.84em;color:var(--muted)}
.med-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%}
.med-card .top2{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.med-card .nm{font:600 1.05em var(--font-head)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0;padding-top:0}
.kv>span:first-child{color:var(--muted)}
.kv>b{text-align:right;min-width:0}
.dots{display:flex;flex-wrap:wrap;gap:7px}
.dot{width:30px;height:16px;border-radius:10px;border:2px solid var(--blue);background:transparent}
.dot.on{background:var(--blue)}
.big-n{font:600 2.6em var(--font-head);line-height:1;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;justify-content:center;gap:20px}
.stepper button{width:64px;height:64px;border-radius:50%;border:2px solid var(--blue);background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;cursor:pointer}
.stepper button[disabled]{opacity:.4;cursor:not-allowed}
.stepper output{font:600 2.6em var(--font-head);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.9em}
.field input,.field select{min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:0 14px;width:100%}
.field input:focus,.field select:focus{border-color:var(--blue);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:.88em;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.trow{display:flex;align-items:center;gap:14px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;min-height:64px;text-align:left;cursor:pointer}
.trow .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.trow small{color:var(--muted);font-size:.8em}
.trow .sw{width:54px;height:32px;border-radius:20px;background:var(--line);position:relative;flex:none;transition:background .15s}
.trow .sw::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.trow[aria-checked="true"] .sw{background:var(--green)}
.trow[aria-checked="true"] .sw::after{transform:translateX(22px)}
.trow[disabled]{opacity:.55;cursor:not-allowed}
.flow{display:flex;align-items:center;gap:4px}
.node{flex:1;text-align:center;font-size:.78em;font-weight:700;padding:10px 4px;border-radius:14px;background:var(--blue-soft);color:var(--blue);display:flex;flex-direction:column;align-items:center;gap:4px}
.node.off{background:var(--line);color:var(--muted)}
.flow>.ic{color:var(--muted)}
.notice{border-radius:14px;padding:12px 14px;font-size:.88em;display:flex;gap:10px;align-items:flex-start}
.notice.blue{background:var(--blue-soft);color:var(--ink)}
.notice.amber{background:var(--amber-soft);color:var(--ink)}
.notice.green{background:var(--green-soft);color:var(--ink)}
.notice .ic{margin-top:1px}
.notice.blue .ic{color:var(--blue)}.notice.amber .ic{color:var(--amber)}.notice.green .ic{color:var(--green)}
.cmp{display:flex;flex-direction:column;gap:6px}
.cmp .r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:.9em}
.cmp .r b{font:600 1.15em var(--font-head);font-variant-numeric:tabular-nums}
.cmp .bar{grid-column:1/-1}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font:600 1.1em var(--font-head);flex:none}
.idrow{display:flex;gap:12px;align-items:center}
.hcard{border-radius:20px;padding:18px;background:var(--blue);color:var(--on-blue);display:flex;flex-direction:column;gap:14px}
.hcard .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hcard .nm{font:600 1.3em var(--font-head)}
.hcard small{opacity:.85}
.log{display:flex;flex-direction:column}
.log .li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.88em}
.log .li:first-child{border-top:0}
.log .li .ic{color:var(--muted);margin-top:2px}
.checklist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.checklist li{display:flex;gap:10px;align-items:flex-start;font-size:.9em}
.checklist .ic{color:var(--green);margin-top:1px}
.login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:28px 22px}
.login .mark{width:84px;height:84px;border-radius:26px;background:var(--blue);color:var(--on-blue);display:grid;place-items:center}
.login h2{font:600 2em var(--font-head);margin:0}
.login p{margin:0;color:var(--muted)}

/* Hojas inferiores y NFC */
.sheet-back{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);width:100%;max-height:90%;overflow-y:auto;border-radius:28px 28px 0 0;padding:12px 18px 24px;display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center;flex:none}
.sheet h2{font:600 1.25em var(--font-head);margin:0}
.sheet p{margin:0}
.quote{border-left:4px solid var(--blue);padding:4px 0 4px 12px;font-size:.92em}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.nfc{position:absolute;inset:0;z-index:30;background:var(--blue);color:var(--on-blue);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center}
.nfc h2{font:600 1.6em var(--font-head);margin:0}
.nfc p{margin:0;opacity:.9}
.nfc .btn.primary{background:var(--on-blue);color:var(--blue)}
.nfc .btn.ghost{border-color:var(--on-blue);color:var(--on-blue)}
.rip{position:relative;width:150px;height:150px;display:grid;place-items:center}
.rip::before,.rip::after{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid var(--on-blue);opacity:0;animation:rip 1.6s ease-out infinite}
.rip::after{animation-delay:.8s}
.rip .core{width:84px;height:84px;border-radius:50%;background:var(--on-blue);color:var(--blue);display:grid;place-items:center}
@keyframes rip{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.15);opacity:0}}
.found{background:var(--on-blue);color:var(--ink);width:100%;border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.found b{font:600 1.1em var(--font-head)}
.found span{color:var(--muted);font-size:.9em}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;z-index:40;text-align:center;font-size:.92em}
.toast[hidden]{display:none}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}

/* Alarmas */
.alarm{position:absolute;inset:0;z-index:60;background:var(--alert-bg);color:var(--alert-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:26px;text-align:center;animation:flash 1.1s ease-in-out infinite alternate;overflow-y:auto}
.alarm h2{font:600 1.7em var(--font-head);margin:0;text-wrap:balance}
.alarm .a-med{font:700 1.5em var(--font-head)}
.alarm p{margin:0}
.alarm .bell{animation:ring .5s ease-in-out infinite alternate;transform-origin:50% 10%}
.alarm .btn{max-width:320px}
.alarm .btn.take{background:var(--alert-fg);color:var(--alert-bg)}
.alarm .btn.ghost{border-color:var(--alert-fg);color:var(--alert-fg)}
@keyframes flash{from{filter:brightness(1)}to{filter:brightness(1.15)}}
@keyframes ring{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.cdbig{font:600 2.4em var(--font-head);font-variant-numeric:tabular-nums;line-height:1.1}
.cd{font:600 1.1em var(--font-head);font-variant-numeric:tabular-nums}
.rem-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rem-time{font:600 1.7em var(--font-head);font-variant-numeric:tabular-nums;line-height:1.1}
.days{display:flex;gap:6px}
.dchip{flex:1;min-width:0;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:700 1em var(--font-body);cursor:pointer;color:var(--ink)}
.dchip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:var(--on-blue)}

/* Guion de la demo */
.guide{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.guide h2{font:600 1.15rem var(--font-head);margin:0}
.guide p{margin:0;color:var(--muted);font-size:.92rem}
.prog{display:flex;align-items:center;gap:12px}
.prog .bar{flex:1}
.prog b{font-variant-numeric:tabular-nums;font-size:.95rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.step{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;border-radius:12px;padding:8px 10px;min-height:46px;cursor:pointer;font-size:.95rem}
.step:hover{background:var(--surface2)}
.step .num{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.78rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.step.done .num{background:var(--green);border-color:var(--green);color:var(--on-green)}
.step.done span.t{color:var(--muted)}
.step.cur{border-color:var(--blue);background:var(--blue-soft)}
.step.cur .num{border-color:var(--blue);color:var(--blue)}
.guide .legal{border-top:1px solid var(--line);padding-top:12px;font-size:.85rem}

@media (max-width:520px){.phone{border-width:4px;border-radius:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<header class="top">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2"/><path d="M12 11v5M9.5 13.5h5"/></svg></div>
    <div>
      <h1>Botiquín Claro</h1>
      <p>Prototipo para clase · todos los datos son ficticios</p>
    </div>
  </div>
  <div class="top-actions">
    <button type="button" class="reset" data-action="reset" id="btn-reset">Reiniciar demo</button>
  </div>
</header>

<main class="stage">
  <section aria-label="Prototipo de la aplicación">
    <div class="phone" id="phone"></div>
  </section>
  <aside class="guide" id="guide" aria-label="Guion de la demostración"></aside>
</main>
<script>

var IC={

 if(soonExp(m))return {t:'Próximo a caducar',c:'amber',i:'clock'};
 if(m.flag)return {t:'Revisar tratamiento',c:'red',i:'alert'};
 if(m.next&&daysUntil(m.next)<=14)return {t:'Próxima dispensación',c:'blue',i:'cal'};

 return {t:'Stock suficiente',c:'green',i:'check'};
}

var DORDER=[1,2,3,4,5,6,0], DLET={1:'L',2:'M',3:'X',4:'J',5:'V',6:'S',0:'D'};
var REM_KEY='botiquin-claro-recordatorios';
function pad(n){return (n<10?'0':'')+n}
function fmtCd(ms){
 if(ms<0)ms=0;var s=Math.ceil(ms/1000),d=Math.floor(s/86400);s-=d*86400;
 var h=Math.floor(s/3600);s-=h*3600;var m=Math.floor(s/60);s-=m*60;
 return (d?d+' d ':'')+pad(h)+':'+pad(m)+':'+pad(s);
}
function occAfter(r,from){
 var p=r.time.split(':');
 for(var i=0;i<8;i++){
  var d=new Date(from);d.setDate(d.getDate()+i);d.setHours(+p[0],+p[1],0,0);
  if(d.getTime()>from&&r.days.indexOf(d.getDay())>=0)return d.getTime();
 }
 return null;
}
function daysLabel(r){
 if(r.days.length===7)return 'Todos los días';
 return DORDER.filter(function(d){return r.days.indexOf(d)>=0}).map(function(d){return DLET[d]}).join(' ');
}
function whenLabel(ms){return new Date(ms).toLocaleString('es-ES',{weekday:'long',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function remNext(){
 var best=null;
 S.rem.forEach(function(r){
  if(!r.on||!medById(r.med))return;
  var at=occAfter(r,r.anchor);
  if(at&&(!best||at<best.at))best={r:r,at:at};
 });
 S.timers.forEach(function(t){if(medById(t.med)&&(!best||t.end<best.at))best={t:t,at:t.end}});
 return best;
}
function saveRem(){
 try{localStorage.setItem(REM_KEY,JSON.stringify({rem:S.rem,sound:S.sound,vib:S.vib}))}catch(e){}
}
function loadRem(){
 try{
  var raw=localStorage.getItem(REM_KEY);if(!raw)return;
  var o=JSON.parse(raw);
  if(Array.isArray(o.rem)){S.rem=o.rem.filter(function(r){return r&&r.time&&Array.isArray(r.days)&&typeof r.anchor==='number'})}
  if(typeof o.sound==='boolean')S.sound=o.sound;
  if(typeof o.vib==='boolean')S.vib=o.vib;
 }catch(e){}
}
function setF(f,v){
 if(f==='reason')S.reason=v;
 else if(f.indexOf('rf_')===0)S.rf[f.slice(3)]=v;
 else if(f==='qm')S.qm=v;
 else S.form[f]=v;
}
function notifState(){try{if(!('Notification' in window))return 'unsupported';return Notification.permission}catch(e){return 'unsupported'}}

/* Sonido, vibración, título y aviso del sistema */
var actx=null,beepT=null,titleT=null,baseTitle=document.title||'Botiquín Claro';
function ensureAudio(){
 try{
  if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}
  if(actx&&actx.state==='suspended')actx.resume();
 }catch(e){}
}
function beep(){
 if(!S.sound||!actx)return;
 try{
  var t=actx.currentTime;
  [0,0.25,0.5].forEach(function(o,i){
   var os=actx.createOscillator(),g=actx.createGain();
   os.type='sine';os.frequency.value=i===1?1175:880;
   g.gain.setValueAtTime(0.0001,t+o);
   g.gain.exponentialRampToValueAtTime(0.35,t+o+0.02);
   g.gain.exponentialRampToValueAtTime(0.0001,t+o+0.2);
   os.connect(g);g.connect(actx.destination);os.start(t+o);os.stop(t+o+0.22);
  });
 }catch(e){}
}
function vibrate(p){if(S.vib&&navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}}
function startAlerting(a){
 var m=medById(a.med);
 if(!beepT){
  beep();vibrate([400,200,400,200,400]);
  beepT=setInterval(function(){beep();vibrate([400,200,400])},2500);
  var on=false;
  titleT=setInterval(function(){on=!on;document.title=on?'¡Hora de tu medicamento!':baseTitle},900);
 }
 try{
  if(notifState()==='granted'){
   new Notification('Es hora de tu medicamento',{body:(m?m.name+' '+m.dose:'Medicamento')+' · '+u(a.qty),requireInteraction:true});
  }
 }catch(e){}
}
function stopAlerting(){
 if(S.alarms.length)return;
 clearInterval(beepT);beepT=null;clearInterval(titleT);titleT=null;document.title=baseTitle;
 try{if(navigator.vibrate)navigator.vibrate(0)}catch(e){}
}
function raise(a){S.alarms.push(a);mark(11);startAlerting(a)}
function startTimer(sec,medId,qty,label){
 S.timers.push({id:S.tid++,med:medId,qty:qty||1,end:Date.now()+sec*1000,label:label||'Cuenta atrás terminada'});
}
function tick(){
 var now=Date.now(),fired=false;
 S.rem.forEach(function(r){
  if(!r.on)return;
  var at=occAfter(r,r.anchor);
  if(at&&now>=at){
   r.anchor=now;fired=true;
   if(now-at<6*3600e3&&medById(r.med))raise({med:r.med,qty:r.qty,label:'Toma programada de las '+r.time});
  }
 });
 S.timers=S.timers.filter(function(t){
  if(now>=t.end){if(medById(t.med))raise({med:t.med,qty:t.qty,label:t.label});fired=true;return false}
  return true;
 });
 if(fired){saveRem();render();return}
 var els=document.querySelectorAll('[data-end]');
 for(var i=0;i<els.length;i++)els[i].textContent=fmtCd(+els[i].getAttribute('data-end')-now);
}

}

/* Guion */
var STEPS=['Entrar como paciente','Consultar el dashboard','Acceder a «Mi botiquín»','Registrar un medicamento con NFC simulado','Consultar cuántas unidades quedan','Registrar el consumo de varias unidades','Ver cómo baja el stock automáticamente','Consultar la fecha de caducidad','Consultar la próxima dispensación','Ver el beneficio final','Programar un recordatorio y recibir la alarma','Ver dónde reciclar un medicamento caducado'];
function renderGuide(){
 var n=0,cur=-1;STEPS.forEach(function(_,i){if(S.done[i+1])n++;else if(cur<0)cur=i});
 var h='<h2>Guion de la demostración</h2><p>Pulsa un paso para ir a esa pantalla. Cada paso se marca solo cuando lo haces.</p><div class="prog">'+bar(n,STEPS.length,'g')+'<b>'+n+'/'+STEPS.length+'</b></div><ol class="steps">'+
 STEPS.map(function(t,i){var d=S.done[i+1];return '<li><button type="button" class="step'+(d?' done':'')+(i===cur?' cur':'')+'" data-action="guide" data-n="'+(i+1)+'"><span class="num">'+(d?ico('check',14):(i+1))+'</span><span class="t">'+t+'</span></button></li>'}).join('')+'</ol>'+
 '<div class="legal"><b>Aviso.</b> Simulación sin conexión con sistemas sanitarios reales. Cualquier modificación real de una dispensación dependería de la normativa sanitaria y del sistema de receta electrónica.</div>';
 $('#guide').innerHTML=h;
}

/* Render */
var lastKey='';
function render(){
 var phone=$('#phone'), prev=phone.querySelector('.ph-main'), st=prev?prev.scrollTop:0;
 var key=S.role+'|'+S.tab+'|'+S.med+'|'+S.add+'|'+S.loggedIn, body;
 if(!S.loggedIn)body=scLogin();
 else if(S.add)body=scAdd();
 else if(S.med)body=scFicha();
 else body=({home:scHome,botiquin:scBotiquin,alarmas:scAlarmas,reciclar:scReciclar,perfil:scPerfil})[S.tab]();
 phone.className='phone'+(S.big?' big':'');
 phone.innerHTML=body+sheetHTML()+nfcHTML()+alarmHTML()+'<div class="toast" role="status" aria-live="polite"'+(S.toast?'':' hidden')+'>'+esc(S.toast)+'</div>';
 var mn=phone.querySelector('.ph-main');if(mn&&key===lastKey)mn.scrollTop=st;lastKey=key;
 renderGuide();
}

/* Acciones */
function cur(){return medById(S.med)}
function openMed(id){var m=medById(id);if(!m)return;S.med=id;S.add=false;S.qty=Math.max(1,Math.min(2,m.stock));S.reason=m.reasons[0];S.lastConsume=null;mark(5,8,9)}
function startNfc(){
 S.sheet=null;S.nfc={phase:'scan'};clearTimeout(nfcTimer);
 nfcTimer=setTimeout(function(){var p=pickTag();S.nfc={phase:'found',med:p.med,isNew:p.isNew};render()},1700);
}
function pickTag(){
 var t=TAGS[S.nfcIdx%TAGS.length];S.nfcIdx++;
 var ex=medById(t.existing?'sumatriptan':t.id);if(ex)return {med:ex,isNew:false};
 var base=t.existing?TAGS[0]:t, ex2=medById(base.id);if(ex2)return {med:ex2,isNew:false};
 return {med:Object.assign({},base),isNew:true};
}
function openSheet(s){
 S.sheet=s;var m=cur();
 if(s==='corregir'&&m)S.fix=m.stock;
 if(s==='impacto')mark(10);
}
function goStep(n){
 S.sheet=null;clearTimeout(nfcTimer);S.nfc=null;S.add=false;S.med=null;
 if(n===1){S.role='patient';S.loggedIn=false;return}
 if(S.role==='patient')S.loggedIn=true;
 var sm=medById('sumatriptan');
 if(n===2){S.tab='home';mark(2)}
 else if(n===3){S.tab='botiquin';mark(3)}
 else if(n===4){S.tab='botiquin';startNfc()}
 else if(n>=5&&n<=8){S.tab='botiquin';if(sm)openMed('sumatriptan');else mark(3)}
 else if(n===9){S.tab='botiquin';if(sm)openMed('sumatriptan');else mark(3)}
 else if(n===10){openSheet('impacto')}
 else if(n===11){S.tab='alarmas'}
 else if(n===12){S.tab='reciclar';mark(12)}
}
var PL={trat:'tratamientos activos',stock:'stock de medicamentos',disp:'dispensaciones',hist:'historial completo'};

function act(a,d){
 var m;
 switch(a){
 case 'login':S.loggedIn=true;S.tab='home';mark(1,2);break;
 case 'logout':S.loggedIn=false;S.tab='home';S.med=null;S.add=false;break;
 case 'tab':S.tab=d.t;S.med=null;S.add=false;S.sheet=null;
  if(d.t==='botiquin')mark(3);if(d.t==='reciclar')mark(12);break;
 case 'open':openMed(d.id);break;
 case 'back':if(S.add)S.add=false;else S.med=null;break;
 case 'goDisp':S.tab='botiquin';openMed(d.id);break;
 case 'add':S.add=true;S.med=null;S.form={name:'',dose:'',units:'',cond:'',disp:TODAY_ISO,exp:'',use:'Según necesidad'};break;
 case 'fillCode':S.form={name:'Ebastina',dose:'10 mg',units:'20',cond:'Alergia estacional',disp:TODAY_ISO,exp:'2028-03',use:'Según síntomas'};toast('Código leído (simulado)');break;
 case 'nfc':S.add=false;startNfc();break;
 case 'nfcClose':clearTimeout(nfcTimer);S.nfc=null;break;
 case 'nfcAdd':
  m=Object.assign({},S.nfc.med);if(!medById(m.id))S.meds.push(m);
  mark(4);S.nfc=null;S.tab='botiquin';openMed(m.id);toast('Medicamento añadido al botiquín');break;
 case 'nfcOpen':m=S.nfc.med;S.nfc=null;S.tab='botiquin';openMed(m.id);break;
 case 'qtyDec':S.qty=Math.max(1,S.qty-1);break;
 case 'qtyInc':m=cur();S.qty=Math.min(m.stock,S.qty+1);break;
 case 'consume':
  m=cur();if(!m||m.stock<1)break;
  var q=Math.min(S.qty,m.stock),from=m.stock;
  m.stock-=q;m.lastUse=TODAY_ISO;
  S.cons.unshift({id:m.id,qty:q,reason:S.reason||m.reasons[0],date:TODAY_ISO});
  S.lastConsume={id:m.id,from:from,to:m.stock};S.qty=Math.max(1,Math.min(q,m.stock));
  mark(6,7);toast('Stock actualizado: '+from+' → '+m.stock);break;
 case 'sheet':openSheet(d.s);break;
 case 'closeSheet':S.sheet=null;break;
 case 'big':S.big=!S.big;break;
 case 'helper':S.helpers[d.k]=!S.helpers[d.k];break;
 case 'fixDec':S.fix=Math.max(0,S.fix-1);break;
 case 'fixInc':S.fix=Math.min(999,S.fix+1);break;
 case 'doCorregir':
  m=cur();if(m){m.stock=S.fix;if(m.stock>m.initial)m.initial=m.stock;S.lastConsume=null;toast('Unidades actualizadas: '+m.stock)}S.sheet=null;break;
 case 'doEliminar':
  m=cur();if(m){S.meds=S.meds.filter(function(x){return x.id!==m.id});if(S.selDisp===m.id)S.selDisp=S.meds[0]?S.meds[0].id:null;toast('Medicamento eliminado')}
  S.med=null;S.sheet=null;S.tab='botiquin';break;
 case 'guide':goStep(+d.n);break;
 case 'remToggle':S.rem.forEach(function(r){if(r.id===d.id){r.on=!r.on;r.anchor=Date.now()}});saveRem();break;
 case 'remDel':S.rem=S.rem.filter(function(r){return r.id!==d.id});saveRem();toast('Recordatorio eliminado');break;
 case 'rfDay':
  var dn=+d.d,ix=S.rf.days.indexOf(dn);if(ix>=0)S.rf.days.splice(ix,1);else S.rf.days.push(dn);break;
 case 'rfQtyDec':S.rf.qty=Math.max(1,S.rf.qty-1);break;
 case 'rfQtyInc':S.rf.qty=Math.min(10,S.rf.qty+1);break;
 case 'remSave':
  if(!S.rf.time){toast('Elige una hora');break}
  if(!S.rf.days.length){toast('Elige al menos un día');break}
  S.rem.push({id:'r'+(S.rid++),med:S.rf.med,time:S.rf.time,days:S.rf.days.slice(),qty:S.rf.qty,on:true,anchor:Date.now()});
  saveRem();toast('Recordatorio guardado');break;
 case 'qs':S.qs=+d.s;break;
 case 'timerStart':
  if(!medById(S.qm)){toast('Elige un medicamento');break}
  startTimer(S.qs,S.qm,1,'Cuenta atrás terminada');toast('Cuenta atrás iniciada');break;
 case 'timerCancel':S.timers=S.timers.filter(function(t){return String(t.id)!==d.id});break;
 case 'testAlarm':
  if(!medById(S.qm)){toast('Añade un medicamento primero');break}
  startTimer(10,S.qm,1,'Alarma de prueba');toast('Sonará en 10 segundos');break;
 case 'soundTog':S.sound=!S.sound;saveRem();break;
 case 'vibTog':S.vib=!S.vib;saveRem();break;
 case 'notifReq':
  try{Promise.resolve(Notification.requestPermission()).then(function(){render()},function(){render()})}
  catch(e){toast('Tu navegador no permite avisos del sistema aquí')}
  break;
 case 'alarmTake':
  var al=S.alarms.shift(),am=al&&medById(al.med);
  if(am&&am.stock>0){
   var aq=Math.min(al.qty,am.stock),af=am.stock;
   am.stock-=aq;am.lastUse=TODAY_ISO;
   S.cons.unshift({id:am.id,qty:aq,reason:am.reasons[0],date:TODAY_ISO});
   toast('Toma registrada: stock '+af+' → '+am.stock);
  }else if(am){toast('Toma registrada (no quedaban unidades en el botiquín)')}
  stopAlerting();break;
 case 'alarmSnooze':
  var sn=S.alarms.shift();
  if(sn)S.timers.push({id:S.tid++,med:sn.med,qty:sn.qty,end:Date.now()+600000,label:'Alarma pospuesta 10 minutos'});
  stopAlerting();toast('Te avisaré en 10 minutos');break;
 case 'alarmSkip':S.alarms.shift();stopAlerting();toast('Toma omitida');break;
 case 'recycleDone':
  m=medById(d.id);
  if(m){
   S.meds=S.meds.filter(function(x){return x.id!==m.id});
   S.rem=S.rem.filter(function(r){return r.med!==m.id});
   S.timers=S.timers.filter(function(t){return t.med!==m.id});
   saveRem();toast('Retirado del botiquín. Gracias por reciclarlo');
  }
  break;
 case 'reset':clearTimeout(nfcTimer);S=initState();lastKey='';stopAlerting();saveRem();break;
 }
 render();
}

/* Eventos */
document.addEventListener('click',function(e){
 ensureAudio();
 var b=e.target.closest('[data-action]');if(!b)return;
 if(b.dataset.action==='backdrop'){if(e.target===b){S.sheet=null;render()}return}
 act(b.dataset.action,b.dataset);
});
document.addEventListener('input',function(e){
 var f=e.target.getAttribute&&e.target.getAttribute('data-f');if(!f)return;
 setF(f,e.target.value);
});
document.addEventListener('change',function(e){
 var f=e.target.getAttribute&&e.target.getAttribute('data-f');if(!f)return;
 setF(f,e.target.value);
});
document.addEventListener('submit',function(e){
 if(e.target.id!=='add-form')return;
 e.preventDefault();
 var g=function(id){var el=document.getElementById(id);return el?el.value.trim():''};
 var name=g('f-name'),units=parseInt(g('f-units'),10);
 S.form={name:name,dose:g('f-dose'),units:g('f-units'),cond:g('f-cond'),disp:g('f-disp')||TODAY_ISO,exp:g('f-exp'),use:g('f-use')||'Según necesidad'};
 if(!name||!(units>0)){toast('Escribe el nombre y las unidades recibidas');render();return}
 var id=slug(name),k=1;while(medById(id)){k++;id=slug(name)+'-'+k}
 var f=S.form;
 S.meds.push({id:id,name:name,dose:f.dose||'—',cond:f.cond||'Sin indicar',useText:(f.cond||'Sin indicar')+' / '+f.use.toLowerCase(),useType:f.use,initial:units,stock:units,lastDisp:f.disp,expiry:f.exp||'2028-12',pack:units,next:null,lastUse:null,flag:false,reasons:['Uso según pauta','Otro motivo']});
 S.add=false;S.tab='botiquin';openMed(id);toast('Medicamento guardado en tu botiquín');render();
});
document.addEventListener('keydown',function(e){
 if(e.key!=='Escape')return;
 if(S.nfc){clearTimeout(nfcTimer);S.nfc=null;render()}else if(S.sheet){S.sheet=null;render()}
});

loadRem();
setInterval(tick,1000);
document.addEventListener('visibilitychange',tick);
render();
})();
</script>

</body></html>
